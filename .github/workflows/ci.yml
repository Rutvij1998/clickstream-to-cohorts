name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: pytest

      - name: dbt parse and DuckDB build
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          dbt deps
          dbt parse --target dev
          dbt build --target dev --full-refresh
          dbt build --target dev --full-refresh --vars '{dev_mode: true}'

      - name: sqlfluff
        working-directory: dbt
        run: sqlfluff lint models tests macros
