version: 2

models:
  - name: stg_rees46__events
    description: >
      Typed events with one row per event_id. silver_source seed reads the
      synthetic seed. silver_source parquet reads data/silver/events.
      dev_mode keeps a 7 day window starting at start_date. event_date limits
      a daily run to that date.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: event_time
        data_tests:
          - not_null
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["view", "cart", "remove_from_cart", "purchase"]
      - name: product_id
        data_tests:
          - not_null
      - name: category_id
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: user_id
        data_tests:
          - not_null
      - name: user_session
        data_tests:
          - not_null
      - name: event_date
        data_tests:
          - not_null
