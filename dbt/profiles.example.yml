clickstream_to_cohorts:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: target/clickstream.duckdb
      schema: main
      threads: 4
      settings:
        TimeZone: UTC
    athena:
      type: athena
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      database: awsdatacatalog
      schema: "{{ env_var('ATHENA_SCHEMA', 'analytics') }}"
      work_group: "{{ env_var('ATHENA_WORKGROUP', 'clickstream-to-cohorts') }}"
      s3_staging_dir: "{{ env_var('ATHENA_S3_STAGING_DIR', 's3://placeholder/athena-results/') }}"
      s3_data_dir: "{{ env_var('ATHENA_S3_DATA_DIR', 's3://placeholder/dbt/') }}"
      s3_data_naming: schema_table
      num_retries: 3
      threads: 4
